<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goto - 시작하기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
    <h2>goto</h2>
    <p>개인정보 없이 닉네임만으로 시작하세요</p>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">사용할 닉네임</label>
        <input type="text" id="username" placeholder="예: concert_lover" required>
      </div>
      <button type="submit" style="width: 100%;">시작하기 / 프로필 불러오기</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      if (username) {
        localStorage.setItem('goto_current_user', username);
        window.location.href = 'main.html';
      }
    });

    // 이미 로그인되어 있는 경우
    if (localStorage.getItem('goto_current_user')) {
      window.location.href = 'main.html';
    }
  </script>
</body>
</html>
