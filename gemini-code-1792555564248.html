<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goto - 공연 상세</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 onclick="location.href='main.html'">goto</h1>
    <button class="secondary" onclick="location.href='main.html'">목록으로</button>
  </header>

  <div class="container">
    <div id="detailHeader" class="detail-header">
      <!-- 상세 헤더 정보가 생성됩니다 -->
    </div>

    <div style="margin-top: 30px;">
      <h3>직관 사진 / 영상 업로드</h3>
      <div id="mediaDropZone" class="drop-zone" style="margin-bottom: 20px;">
        클릭하거나 사진/영상을 드래그해서 등록하세요 (모바일은 클릭 후 갤러리 선택)
        <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none;">
      </div>

      <div id="mediaGallery" class="media-gallery">
        <!-- 업로드된 사진/영상들이 보입니다 -->
      </div>
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem('goto_current_user');
    if (!currentUser) window.location.href = 'index.html';

    const urlParams = new URLSearchParams(window.location.search);
    const concertId = urlParams.get('id');

    function getStorageKey() {
      return `goto_data_${currentUser}`;
    }

    function getConcerts() {
      return JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
    }

    const concerts = getConcerts();
    const concert = concerts[concertId];

    if (!concert) {
      alert('존재하지 않는 공연입니다.');
      window.location.href = 'main.html';
    }

    // 상세 헤더 출력
    document.getElementById('detailHeader').innerHTML = `
      <img class="detail-poster" src="${concert.poster || 'https://via.placeholder.com/300x400?text=No+Poster'}" alt="${concert.title}">
      <div class="detail-meta">
        <h2>${concert.title}</h2>
        <p><strong>날짜:</strong> ${concert.date}</p>
        <p><strong>좌석:</strong> ${concert.seat || '미입력'}</p>
      </div>
    `;

    // 미디어 렌더링
    function renderMedia() {
      const gallery = document.getElementById('mediaGallery');
      const mediaList = concert.mediaList || [];

      if (mediaList.length === 0) {
        gallery.innerHTML = '<p style="grid-column: 1/-1; color: #8e8e8e;">업로드된 사진이나 영상이 없습니다.</p>';
        return;
      }

      gallery.innerHTML = mediaList.map(item => {
        if (item.type === 'image') {
          return `<img src="${item.url}" class="media-item">`;
        } else {
          return `<video src="${item.url}" class="media-item" controls></video>`;
        }
      }).join('');
    }

    // 미디어 파일 업로드 처리
    const mediaDropZone = document.getElementById('mediaDropZone');
    const mediaInput = document.getElementById('mediaInput');

    mediaDropZone.addEventListener('click', () => mediaInput.click());

    mediaInput.addEventListener('change', (e) => handleMediaFiles(e.target.files));

    mediaDropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      mediaDropZone.classList.add('dragover');
    });

    mediaDropZone.addEventListener('dragleave', () => mediaDropZone.classList.remove('dragover'));

    mediaDropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      mediaDropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        handleMediaFiles(e.dataTransfer.files);
      }
    });

    function handleMediaFiles(files) {
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        const isVideo = file.type.startsWith('video/');

        reader.onload = (e) => {
          if (!concert.mediaList) concert.mediaList = [];
          
          concert.mediaList.push({
            type: isVideo ? 'video' : 'image',
            url: e.target.result
          });

          // LocalStorage 업데이트
          concerts[concertId] = concert;
          try {
            localStorage.setItem(getStorageKey(), JSON.stringify(concerts));
            renderMedia();
          } catch (err) {
            alert('용량이 너무 큽니다. 사진/영상 크기를 줄여주세요.');
          }
        };

        reader.readAsDataURL(file);
      });
    }

    renderMedia();
  </script>
</body>
</html>
